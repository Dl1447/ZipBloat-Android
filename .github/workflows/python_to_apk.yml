name: Build Python to APK

# 触发条件：推送到 main 分支/创建标签/手动触发
on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 手动触发开关

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      # 步骤1：拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 步骤2：安装系统依赖
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git python3 python3-pip python3-venv libssl-dev libffi-dev \
              build-essential openjdk-17-jdk android-sdk android-ndk cmake \
              autoconf automake libtool pkg-config zlib1g-dev

      # 步骤3：缓存 Buildozer 依赖（加速后续构建）
      - name: Cache Buildozer dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.buildozer
            ./.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      # 步骤4：安装 Buildozer
      - name: Install Buildozer
        run: |
          python3 -m pip install --upgrade pip
          pip3 install buildozer

      # 步骤5：初始化/覆盖 Buildozer 配置（可选，优先用项目内的 spec 文件）
      - name: Configure Buildozer
        run: |
          if [ ! -f buildozer.spec ]; then
              buildozer init
              # 替换 spec 配置（根据你的项目修改）
              sed -i 's/^requirements =.*/requirements = python3,kivy/' buildozer.spec
              sed -i 's/^app_name =.*/app_name = PythonAPKDemo/' buildozer.spec
              sed -i 's/^package\.name =.*/package.name = pythonapk/' buildozer.spec
              sed -i 's/^package\.domain =.*/package.domain = org.example/' buildozer.spec
          fi

      # 步骤6：开始打包 APK（核心）
      - name: Build APK with Buildozer
        run: |
          buildozer android debug

      # 步骤7：上传 APK 作为构建产物（可下载）
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-apk-file
          path: ./bin/*.apk  # 匹配 bin 目录下所有 APK 文件