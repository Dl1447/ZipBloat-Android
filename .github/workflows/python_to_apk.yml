name: Build Python to APK

# 触发条件：推送到 main 分支/创建标签/手动触发
on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 手动触发开关

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      # 步骤1：拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 步骤2：安装系统依赖
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git python3 python3-pip python3-venv libssl-dev libffi-dev \
              build-essential openjdk-17-jdk cmake \
              autoconf automake libtool pkg-config zlib1g-dev wget curl unzip

      # 步骤3：缓存 Buildozer 依赖（加速后续构建）
      - name: Cache Buildozer dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.buildozer
            ./.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      # 步骤4：手动下载 Android SDK 和 NDK
      - name: Manually download Android SDK and NDK
        run: |
          # 创建必要的目录
          mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest
          mkdir -p ~/.buildozer/android/platform/android-ndk-r23
          mkdir -p ~/.android
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > ~/.android/repositories.cfg
          
          # 下载Android SDK Command Line Tools
          SDK_URL="https://dl.google.com/android/repository/commandlinetools-linux-6858069_latest.zip"
          SDK_ZIP="commandlinetools-linux-6858069_latest.zip"
          
          echo "Downloading Android SDK Command Line Tools..."
          wget -c --tries=5 --timeout=60 "$SDK_URL" -O "$SDK_ZIP"
          unzip -q "$SDK_ZIP" -d ~/.buildozer/android/platform/android-sdk/cmdline-tools
          mv ~/.buildozer/android/platform/android-sdk/cmdline-tools/cmdline-tools/* ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/
          rm "$SDK_ZIP"
          
          # 下载Android NDK
          NDK_URL="https://dl.google.com/android/repository/android-ndk-r23-linux.zip"
          NDK_ZIP="android-ndk-r23-linux.zip"
          
          echo "Downloading Android NDK..."
          wget -c --tries=5 --timeout=60 "$NDK_URL" -O "$NDK_ZIP"
          unzip -q "$NDK_ZIP" -d ~/.buildozer/android/platform/
          rm "$NDK_ZIP"
          
          # 设置权限
          chmod -R 755 ~/.buildozer
          
          # 安装必要的SDK packages
          export ANDROID_HOME=~/.buildozer/android/platform/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          
          echo "Installing SDK packages..."
          yes | sdkmanager "platforms;android-31"
          yes | sdkmanager "build-tools;31.0.0"
          yes | sdkmanager "platform-tools"

      # 步骤5：安装 Buildozer
      - name: Install Buildozer
        run: |
          python3 -m pip install --upgrade pip
          pip3 install buildozer

      # 步骤6：初始化/覆盖 Buildozer 配置（可选，优先用项目内的 spec 文件）
      - name: Configure Buildozer
        run: |
          if [ ! -f buildozer.spec ]; then
              buildozer init
              # 替换 spec 配置（根据你的项目修改）
              sed -i 's/^requirements =.*/requirements = python3,kivy/' buildozer.spec
              sed -i 's/^app_name =.*/app_name = PythonAPKDemo/' buildozer.spec
              sed -i 's/^package\.name =.*/package.name = pythonapk/' buildozer.spec
              sed -i 's/^package\.domain =.*/package.domain = org.example/' buildozer.spec
          fi

      # 步骤7：开始打包 APK（核心）
      - name: Build APK with Buildozer
        run: |
          # 设置环境变量
          export ANDROID_HOME=~/.buildozer/android/platform/android-sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export ANDROID_NDK_HOME=~/.buildozer/android/platform/android-ndk-r23
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          
          # 修改 buildozer.spec 文件，指定使用我们下载的 NDK
          sed -i 's/^android\.ndk =.*/android.ndk = 23.1.7779620/' buildozer.spec
          
          # 运行 buildozer，但跳过 SDK/NDK 下载
          buildozer android debug --skip-update

      # 步骤8：上传 APK 作为构建产物（可下载）
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-apk-file
          path: ./bin/*.apk  # 匹配 bin 目录下所有 APK 文件