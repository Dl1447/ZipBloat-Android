name: Release

# 触发条件
on:
  push:
    branches:
      - main

    tags:
      - "v*"

# 一次持续集成的运行，可以完成多个任务
jobs:
  build:
    # 构建的系统
    runs-on: ubuntu-latest

    # 构建权限
    permissions:
      contents: write

    # 操作步骤
    steps:

      # 拉取仓库代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 设置Python环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install cython
          sudo apt-get update
          echo "deb http://archive.ubuntu.com/ubuntu/ jammy universe" | sudo tee /etc/apt/sources.list.d/jammy.list
          echo "Package: *" | sudo tee /etc/apt/preferences.d/jammy
          echo "Pin: release n=jammy" | sudo tee -a /etc/apt/preferences.d/jammy
          echo "Pin-Priority: -10" | sudo tee -a /etc/apt/preferences.d/jammy
          echo "Package: libtinfo5" | sudo tee -a /etc/apt/preferences.d/jammy
          echo "Pin: release n=jammy" | sudo tee -a /etc/apt/preferences.d/jammy
          echo "Pin-Priority: 500" | sudo tee -a /etc/apt/preferences.d/jammy
          sudo apt-get update
          sudo apt-get install -y libtinfo5
          sudo apt-get install -y build-essential git python3 python3-dev openjdk-17-jdk
          sudo apt-get install -y automake libtool pkg-config libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          sudo apt-get install -y python3-setuptools

      # 缓存buildozer
      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            buildozer.spec
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      # 构建APK
      - name: Build APK
        run: |
          mkdir -p ~/.android
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > ~/.android/repositories.cfg
          export ANDROID_HOME=~/.buildozer/android/platform/android-sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export ANDROID_ACCEPT_SDK_LICENSES=yes
          
          # 确保SDK管理器可用并安装build-tools
          if [ ! -d "$ANDROID_HOME" ]; then
            mkdir -p "$ANDROID_HOME"
          fi
          
          # 安装SDK命令行工具
          SDK_TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip"
          curl -o sdk-tools.zip "$SDK_TOOLS_URL"
          unzip -q sdk-tools.zip -d "$ANDROID_HOME"
          rm sdk-tools.zip
          
          # 设置SDK管理器路径
          export PATH="$ANDROID_HOME/cmdline-tools/bin:$PATH"
          
          # 接受许可证并安装build-tools
          echo "y" | sdkmanager --licenses > /dev/null 2>&1 || true
          echo "y" | sdkmanager "build-tools;33.0.0" "platform-tools" "platforms;android-33" > /dev/null 2>&1 || true
          
          # 验证build-tools安装
          ls -la "$ANDROID_HOME/build-tools/"
          
          # 构建APK
          buildozer android debug

      # 查看生成的APK
      - name: List generated APKs
        run: ls -la bin/

      # 重命名APK
      - name: Rename APK
        run: |
          APK_FILE=$(ls bin/*.apk)
          NEW_NAME="ZipBloat-Android-${GITHUB_REF_NAME:-main}.apk"
          mv "$APK_FILE" "$NEW_NAME"
          echo "APK_NAME=$NEW_NAME" >> $GITHUB_ENV

      # 上传APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZipBloat-Android-APK
          path: "${{ env.APK_NAME }}"
          retention-days: 30

      # 发布
      - name: Create Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: ncipollo/release-action@v1
        with:
          artifacts: "${{ env.APK_NAME }}"
          token: ${{ github.token }}
          generateReleaseNotes: true
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}