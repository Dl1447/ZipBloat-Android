name: 构建 Python 项目为 APK

# 触发规则：支持手动触发、主分支推送、标签推送
on:
  workflow_dispatch:  # 手动触发（优先级最高）
    inputs:
      build_type:
        description: 构建类型（debug/release）
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
      clean_cache:
        description: 是否清理缓存重新构建
        required: true
        default: false
        type: boolean
  push:
    branches: [ main, master ]  # 主分支推送自动构建（debug 模式）
    tags: [ 'v*' ]              # 标签推送自动构建（release 模式）

# 全局环境变量
env:
  PYTHON_VERSION: "3.10"
  BUILDOZER_VERSION: "1.5.0"
  ANDROID_API_LEVEL: "33"
  ANDROID_NDK_VERSION: "25b"
  APP_NAME: "PythonAPK"
  PACKAGE_NAME: "pythonapk"
  PACKAGE_DOMAIN: "org.example"

jobs:
  build-apk:
    runs-on: ubuntu-22.04  # 稳定的 LTS 版本
    timeout-minutes: 120    # 打包耗时久，延长超时时间
    permissions:
      contents: write       # 允许上传产物/创建发布

    steps:
      ###########################################################################
      # 步骤1：拉取代码 + 环境准备
      ###########################################################################
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # 仅拉取最新提交，加速

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"     # 缓存 pip 依赖

      - name: 安装系统级依赖
        run: |
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y --no-install-recommends \
            git build-essential openjdk-17-jdk unzip zip \
            libssl-dev libffi-dev zlib1g-dev pkg-config \
            autoconf automake libtool cmake
          # 清理系统缓存，释放空间
          sudo apt autoremove -y && sudo apt clean

      ###########################################################################
      # 步骤2：缓存优化（核心提速）
      ###########################################################################
      - name: 缓存 Buildozer 依赖（SDK/NDK/包）
        id: cache-buildozer
        if: ${{ github.event.inputs.clean_cache != 'true' }}
        uses: actions/cache@v3
        with:
          path: |
            ~/.buildozer
            ./.buildozer
            ./bin
          key: ${{ runner.os }}-buildozer-${{ env.ANDROID_API_LEVEL }}-${{ hashFiles('buildozer.spec', 'requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-${{ env.ANDROID_API_LEVEL }}-
            ${{ runner.os }}-buildozer-

      ###########################################################################
      # 步骤3：安装 Buildozer 并配置项目
      ###########################################################################
      - name: 安装 Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==${{ env.BUILDOZER_VERSION }}
          # 验证安装
          buildozer --version

      - name: 生成/覆盖 Buildozer 配置文件
        run: |
          # 如果项目无 spec 文件，初始化并覆盖核心配置
          if [ ! -f buildozer.spec ]; then
              buildozer init
              
              # 核心配置替换（按需修改）
              sed -i "s/^app_name =.*/app_name = ${{ env.APP_NAME }}/" buildozer.spec
              sed -i "s/^package\.name =.*/package.name = ${{ env.PACKAGE_NAME }}/" buildozer.spec
              sed -i "s/^package\.domain =.*/package.domain = ${{ env.PACKAGE_DOMAIN }}/" buildozer.spec
              sed -i "s/^android\.api =.*/android.api = ${{ env.ANDROID_API_LEVEL }}/" buildozer.spec
              sed -i "s/^android\.ndk =.*/android.ndk = ${{ env.ANDROID_NDK_VERSION }}/" buildozer.spec
              sed -i "s/^requirements =.*/requirements = python3,kivy,plyer/" buildozer.spec
              
              # 可选：添加权限、禁用日志、精简体积
              sed -i "s/^android\.permissions =.*/android.permissions = INTERNET,WRITE_EXTERNAL_STORAGE/" buildozer.spec
              sed -i "s/^android\.logcat_filter =.*/android.logcat_filter = *:E/" buildozer.spec
              sed -i "s/^android\.remove_android_license =.*/android.remove_android_license = True/" buildozer.spec
          fi
          
          # 打印配置，便于调试
          cat buildozer.spec

      ###########################################################################
      # 步骤4：执行 APK 构建（核心步骤）
      ###########################################################################
      - name: 清理旧构建产物（如果指定清理缓存）
        if: ${{ github.event.inputs.clean_cache == 'true' }}
        run: |
          buildozer android clean
          rm -rf ./bin/*

      - name: 构建 APK（根据触发方式选择 debug/release）
        id: build
        run: |
          # 自动判断构建类型：标签推送/手动指定 release 则打正式包，否则 debug
          if [[ "${{ github.ref_type }}" == "tag" || "${{ github.event.inputs.build_type }}" == "release" ]]; then
              BUILD_TYPE="release"
          else
              BUILD_TYPE="debug"
          fi
          
          echo "开始构建 ${BUILD_TYPE} 版本 APK..."
          buildozer android ${BUILD_TYPE}
          
          # 输出 APK 路径，供后续步骤使用
          APK_PATH=$(find ./bin -name "*.apk" | head -n 1)
          echo "APK_PATH=${APK_PATH}" >> $GITHUB_OUTPUT
          echo "BUILD_TYPE=${BUILD_TYPE}" >> $GITHUB_OUTPUT

      ###########################################################################
      # 步骤5：产物处理 + 上传
      ###########################################################################
      - name: 验证 APK 文件
        run: |
          if [ ! -f "${{ steps.build.outputs.APK_PATH }}" ]; then
              echo "APK 构建失败，未找到产物文件！"
              exit 1
          fi
          # 打印 APK 信息
          ls -lh ${{ steps.build.outputs.APK_PATH }}
          file ${{ steps.build.outputs.APK_PATH }}

      - name: 上传 APK 作为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ steps.build.outputs.BUILD_TYPE }}-${{ github.sha }}
          path: ${{ steps.build.outputs.APK_PATH }}
          retention-days: 30  # 产物保留 30 天

      ###########################################################################
      # 步骤6：（可选）标签推送时自动创建 GitHub Release 并上传 APK
      ###########################################################################
      - name: 创建 GitHub Release 并上传 APK
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          body: |
            📦 Python 转 APK 自动构建产物
            - 构建类型：${{ steps.build.outputs.BUILD_TYPE }}
            - 提交哈希：${{ github.sha }}
            - Android API 级别：${{ env.ANDROID_API_LEVEL }}
          files: ${{ steps.build.outputs.APK_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      ###########################################################################
      # 步骤7：构建失败通知（可选，需配置钉钉/企业微信/邮件等）
      ###########################################################################
      - name: 构建失败通知（示例：打印错误日志）
        if: ${{ failure() }}
        run: |
          echo "APK 构建失败！以下是 Buildozer 日志片段："
          cat ./.buildozer/android/platform/build/logs/main.log | tail -n 50