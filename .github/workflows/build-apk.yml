name: Release

# 触发条件
on:
  push:
    branches:
      - main

    tags:
      - "v*"

# 一次持续集成的运行，可以完成多个任务
jobs:
  build:
    # 构建的系统
    runs-on: ubuntu-latest

    # 构建权限
    permissions:
      contents: write

    # 操作步骤
    steps:

      # 拉取仓库代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 设置Python环境
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      # 设置Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install cython
          sudo apt-get update
          echo "deb http://archive.ubuntu.com/ubuntu/ jammy universe" | sudo tee /etc/apt/sources.list.d/jammy.list
          echo "Package: *" | sudo tee /etc/apt/preferences.d/jammy
          echo "Pin: release n=jammy" | sudo tee -a /etc/apt/preferences.d/jammy
          echo "Pin-Priority: -10" | sudo tee -a /etc/apt/preferences.d/jammy
          echo "Package: libtinfo5" | sudo tee -a /etc/apt/preferences.d/jammy
          echo "Pin: release n=jammy" | sudo tee -a /etc/apt/preferences.d/jammy
          echo "Pin-Priority: 500" | sudo tee -a /etc/apt/preferences.d/jammy
          sudo apt-get update
          sudo apt-get install -y libtinfo5
          sudo apt-get install -y build-essential git python3 python3-dev openjdk-17-jdk
          sudo apt-get install -y automake libtool pkg-config libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          sudo apt-get install -y python3-setuptools

      # 缓存buildozer
      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            buildozer.spec
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      # 构建APK
      - name: Build APK
        run: |
          mkdir -p ~/.android
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > ~/.android/repositories.cfg
          
          # 使用GitHub Actions提供的Android SDK
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_ACCEPT_SDK_LICENSES=yes
          
          # 设置PATH
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/tools:$PATH"
          
          # 验证SDK安装
          echo "Checking Android SDK installation..."
          ls -la "$ANDROID_HOME/"
          ls -la "$ANDROID_HOME/cmdline-tools/"
          ls -la "$ANDROID_HOME/build-tools/" || echo "build-tools directory not found"
          
          # 安装必要的SDK组件
          echo "Installing necessary SDK components..."
          yes | sdkmanager "build-tools;33.0.0" "platform-tools" "platforms;android-33" "ndk;25.2.9519653" > /dev/null 2>&1 || echo "SDK components installed"
          
          # 创建符号链接让buildozer找到sdkmanager
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ] && [ ! -d "$ANDROID_HOME/tools/bin" ]; then
            echo "Creating symlink for sdkmanager..."
            mkdir -p "$ANDROID_HOME/tools"
            ln -s "$ANDROID_HOME/cmdline-tools/latest/bin" "$ANDROID_HOME/tools/bin"
          fi
          
          # 从Secrets中获取并创建临时keystore文件
          echo "Creating temporary keystore file..."
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > zipbloat.keystore
          ls -la zipbloat.keystore
          
          # 构建APK
          echo "Building APK with buildozer..."
          export KEY_STORE_PASSWORD=${{ secrets.KEY_STORE_PASSWORD }}
          export KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          buildozer android release
          
          # 清理临时keystore文件
          echo "Cleaning up temporary keystore file..."
          rm zipbloat.keystore

      # 查看生成的APK
      - name: List generated APKs
        run: ls -la bin/

      # 重命名APK
      - name: Rename APK
        run: |
          APK_FILE=$(ls bin/*.apk)
          NEW_NAME="ZipBloat-Android-${GITHUB_REF_NAME:-main}.apk"
          mv "$APK_FILE" "$NEW_NAME"
          echo "APK_NAME=$NEW_NAME" >> $GITHUB_ENV

      # 上传APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZipBloat-Android-APK
          path: "${{ env.APK_NAME }}"
          retention-days: 30

      # 发布
      - name: Create Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: ncipollo/release-action@v1
        with:
          artifacts: "${{ env.APK_NAME }}"
          token: ${{ github.token }}
          generateReleaseNotes: true
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}