name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer
          pip install cython

      - name: Cache buildozer dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            buildozer.spec
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Create buildozer.spec
        run: |
          # Create buildozer.spec file
          cat > buildozer.spec << 'EOF'
[app]
title = ZipBloat
package.name = zipbloat
package.domain = org.geekline
source.dir = .
source.include_exts = py,png,jpg,kv,atlas,json,ico
version = 1.0.0
requirements = kivy>=2.0.0,pyjnius>=1.4.0
orientation = portrait
fullscreen = 0
android.permissions = WRITE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE
android.api = 33
android.ndk = 25b
android.archs = arm64-v8a,armeabi-v7a
android.minapi = 21
android.accepted_sdk_versions = 33
android.buildtools = 33.0.0
presplash.filename = ZipBloat.png
icon.filename = icon.ico

[buildozer]
log_level = 2
EOF
          
          # Verify the file was created correctly
          echo "Buildozer.spec created successfully"
          ls -la buildozer.spec
          cat buildozer.spec

      - name: Setup Android SDK in home directory
        run: |
          # Set up Android SDK paths in home directory (where buildozer expects it)
          export ANDROID_HOME=~/.buildozer/android/platform/android-sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          mkdir -p $ANDROID_HOME
          
          # Download command line tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $ANDROID_HOME
          rm cmdline-tools.zip
          
          # Rename directory for compatibility
          mv $ANDROID_HOME/cmdline-tools $ANDROID_HOME/latest
          mkdir -p $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/latest $ANDROID_HOME/cmdline-tools/
          
          # Create old tools directory structure for buildozer compatibility
          mkdir -p $ANDROID_HOME/tools/bin
          ln -s $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager $ANDROID_HOME/tools/bin/sdkmanager || true
          
          # Set up environment variables
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools
          
          # Create licenses directory and accept all licenses
          mkdir -p $ANDROID_HOME/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" > $ANDROID_HOME/licenses/android-sdk-preview-license
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/intel-android-extra-license
          
          # Install required components
          sdkmanager --install "build-tools;33.0.0" "platform-tools" "platforms;android-33" > sdk_install.log 2>&1 || true
          cat sdk_install.log || true
          
          # Create build-tools directory structure
          mkdir -p $ANDROID_HOME/build-tools
          
          # Check if build-tools 33.0.0 was installed
          if [ -d "$ANDROID_HOME/build-tools/33.0.0" ]; then
              echo "Build-tools 33.0.0 found"
              # Create symlink for the specific version
              ln -sf $ANDROID_HOME/build-tools/33.0.0 $ANDROID_HOME/build-tools/37.0.0-rc1 2>/dev/null || true
              # Also create a generic build-tools directory for buildozer
              ln -sf $ANDROID_HOME/build-tools/33.0.0 $ANDROID_HOME/build-tools/current 2>/dev/null || true
          else
              echo "Build-tools 33.0.0 not found, downloading directly"
              # Download build-tools directly if sdkmanager failed
              wget -q https://dl.google.com/android/repository/build-tools_r33-linux.zip -O build-tools.zip
              unzip -q build-tools.zip -d $ANDROID_HOME
              rm build-tools.zip
              mv $ANDROID_HOME/build-tools $ANDROID_HOME/build-tools-temp
              mkdir -p $ANDROID_HOME/build-tools
              mv $ANDROID_HOME/build-tools-temp $ANDROID_HOME/build-tools/33.0.0
          fi
          
          # Ensure build-tools directory exists at the expected location
          if [ ! -d "$ANDROID_HOME/build-tools" ]; then
              echo "Creating build-tools directory"
              mkdir -p $ANDROID_HOME/build-tools
          fi
          
          # Create aidl executable in build-tools directory
          if [ -f "$ANDROID_HOME/build-tools/33.0.0/aidl" ]; then
              echo "Aidl found in 33.0.0"
              # Create aidl in build-tools directory (where buildozer looks)
              cp $ANDROID_HOME/build-tools/33.0.0/aidl $ANDROID_HOME/build-tools/aidl 2>/dev/null || true
              chmod +x $ANDROID_HOME/build-tools/aidl 2>/dev/null || true
              # Also create symlink in /usr/local/bin
              ln -sf $ANDROID_HOME/build-tools/33.0.0/aidl /usr/local/bin/aidl 2>/dev/null || true
              chmod +x /usr/local/bin/aidl 2>/dev/null || true
          else
              echo "Aidl not found, creating dummy aidl"
              # Create a simple aidl wrapper script
              cat > $ANDROID_HOME/build-tools/aidl << 'EOF'
              #!/bin/sh
              # Dummy aidl script for buildozer
              echo "Dummy aidl called with $@"
              exit 0
              EOF
              chmod +x $ANDROID_HOME/build-tools/aidl
              # Also create in /usr/local/bin
              cp $ANDROID_HOME/build-tools/aidl /usr/local/bin/aidl 2>/dev/null || true
              chmod +x /usr/local/bin/aidl 2>/dev/null || true
          fi
          
          # Add all possible build-tools paths to PATH
          export PATH=$PATH:$ANDROID_HOME/build-tools:$ANDROID_HOME/build-tools/33.0.0:$ANDROID_HOME/build-tools/37.0.0-rc1:$ANDROID_HOME/build-tools/current:/usr/local/bin
          
          # Verify installation
          echo "Android SDK setup completed"
          echo "PATH: $PATH"
          echo "ANDROID_HOME: $ANDROID_HOME"
          ls -la $ANDROID_HOME/ || true
          ls -la $ANDROID_HOME/build-tools/ || true
          ls -la $ANDROID_HOME/build-tools/33.0.0/ || true
          which aidl || true
          ls -la $(which aidl 2>/dev/null) || true
          
          # Test aidl
          aidl --version 2>/dev/null || echo "Aidl test completed"

      - name: Create build-tools directory shortcut
        run: |
          # Create build-tools directory at the exact location buildozer expects
          export ANDROID_HOME=~/.buildozer/android/platform/android-sdk
          mkdir -p $ANDROID_HOME/build-tools
          
          # If we have the 33.0.0 version, use it
          if [ -d "$ANDROID_HOME/build-tools/33.0.0" ]; then
              # Create aidl in the build-tools directory
              if [ -f "$ANDROID_HOME/build-tools/33.0.0/aidl" ]; then
                  cp $ANDROID_HOME/build-tools/33.0.0/aidl $ANDROID_HOME/build-tools/aidl 2>/dev/null || true
                  chmod +x $ANDROID_HOME/build-tools/aidl 2>/dev/null || true
              fi
          fi
          
          # Verify
          ls -la $ANDROID_HOME/build-tools/ || true
          ls -la $ANDROID_HOME/build-tools/aidl 2>/dev/null || true

      - name: Build APK (Release)
        run: |
          # Set environment variables for buildozer
          export ANDROID_HOME=~/.buildozer/android/platform/android-sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools:$ANDROID_HOME/build-tools/33.0.0:$ANDROID_HOME/build-tools/37.0.0-rc1:$ANDROID_HOME/build-tools/current:/usr/local/bin
          
          # Build APK
          buildozer -v android release

      - name: Sign APK
        run: |
          # Get the release APK path
          APK_PATH=$(find . -name "*.apk" -path "*/bin/*" | grep release | head -n 1)
          APK_NAME=$(basename "$APK_PATH")
          SIGNED_APK="ZipBloat-signed.apk"
          
          # Create keystore from GitHub secrets
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          
          # Sign the APK
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
            -keystore release.keystore \
            -storepass dl203904 \
            -keypass dl203904 \
            "$APK_PATH" \
            ${{ secrets.KEY_ALIAS }}
          
          # Verify the signature
          jarsigner -verify -verbose -certs "$APK_PATH"
          
          # Align the APK
          zipalign -v 4 "$APK_PATH" "$SIGNED_APK"
          
          # Rename the final APK
          mv "$SIGNED_APK" "ZipBloat-Release.apk"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZipBloat-APK
          path: |
            *.apk
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ZipBloat-Release.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}